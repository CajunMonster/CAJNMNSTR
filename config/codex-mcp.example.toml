# Copy this table into a local Codex config only after setting the two
# credential variables in the owner's local environment. Never put secret
# values in this repository or in config.toml.
[mcp_servers.alpaca_market_readonly]
command = "uvx"
args = ["alpaca-mcp-server==2.3.0"]
env_vars = ["ALPACA_API_KEY", "ALPACA_SECRET_KEY"]
env = { ALPACA_PAPER_TRADE = "true", ALPACA_TOOLSETS = "assets,stock-data,options-data,news" }
enabled = false
required = false
startup_timeout_sec = 30
tool_timeout_sec = 60
default_tools_approval_mode = "prompt"
