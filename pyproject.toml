[project]
name = "cajnmnstr"
version = "0.1.0"
description = "Evidence-governed SPY options paper-trading agent"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alpaca-py==0.44.0",
  "mcp>=2.1.1,<3",
  "openai>=3.5.0,<4",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "ruff>=0.16.5,<0.17",
]

[project.scripts]
cajnmnstr = "cajnmnstr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cajnmnstr"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
